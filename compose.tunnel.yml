services:
  cloudflared:
    profiles:
      - public-tunnel
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 100
    networks:
      - frontend
    secrets:
      - source: cloudflare_tunnel_token
        target: cloudflare_tunnel_token
    command: ["tunnel", "--no-autoupdate", "run"]

secrets:
  cloudflare_tunnel_token:
    file: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:-/etc/partsradar/secrets/cloudflare-tunnel-token}
