name: partsradar-tw

x-app-env: &app-env
  NODE_ENV: "production"
  DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public"
  COOLPC_BASE_URL: "https://www.coolpc.com.tw"
  SNAPSHOT_STORAGE_DIR: "/var/lib/partsradar/snapshots"
  PRODUCT_IMAGE_STORAGE_DIR: "/var/lib/partsradar/product-images"
  EXTERNAL_FETCH_LOCK_DIR: "/var/lib/partsradar/snapshots/.locks/external-fetch"
  PARTSRADAR_PUBLIC_BASE_URL: "${PARTSRADAR_PUBLIC_BASE_URL:-https://partsradar.net}"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      target: migrate
    restart: "no"
    command: ["pnpm", "db:seed"]
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  storage-init:
    build:
      context: .
      target: crawler
    user: root
    restart: "no"
    command:
      [
        "sh",
        "-c",
        "mkdir -p /var/lib/partsradar/snapshots /var/lib/partsradar/product-images && chown -R node:node /var/lib/partsradar/snapshots /var/lib/partsradar/product-images",
      ]
    volumes:
      - snapshots:/var/lib/partsradar/snapshots

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_READ_RATE_LIMIT_MAX: "${API_READ_RATE_LIMIT_MAX:-120}"
      API_LIST_RATE_LIMIT_MAX: "${API_LIST_RATE_LIMIT_MAX:-360}"
      API_IMAGE_RATE_LIMIT_MAX: "${API_IMAGE_RATE_LIMIT_MAX:-1200}"
      API_RATE_LIMIT_WINDOW_SECONDS: "${API_RATE_LIMIT_WINDOW_SECONDS:-60}"
      API_RATE_LIMIT_CACHE_SIZE: "${API_RATE_LIMIT_CACHE_SIZE:-5000}"
      OPS_STATUS_ENABLED: "false"
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    volumes:
      - product_images:/var/lib/partsradar/product-images:ro
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/source-status').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  ops-web:
    profiles:
      - ops
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: 3000
      HOSTNAME: 0.0.0.0
      OPS_STATUS_ENABLED: "true"
      OPS_STATUS_TOKEN: "${OPS_STATUS_TOKEN:-replace_with_ops_status_token}"
      SMOKE_SOURCE_WARN_AFTER_MINUTES: "${SMOKE_SOURCE_WARN_AFTER_MINUTES:-60}"
      SMOKE_SOURCE_FAIL_AFTER_MINUTES: "${SMOKE_SOURCE_FAIL_AFTER_MINUTES:-120}"
      SMOKE_CRAWLER_WARN_AFTER_MINUTES: "${SMOKE_CRAWLER_WARN_AFTER_MINUTES:-90}"
      SMOKE_CRAWLER_FAIL_AFTER_MINUTES: "${SMOKE_CRAWLER_FAIL_AFTER_MINUTES:-180}"
      SMOKE_RECENT_WINDOW_HOURS: "${SMOKE_RECENT_WINDOW_HOURS:-24}"
      SMOKE_PARSE_ERROR_WARN_COUNT: "${SMOKE_PARSE_ERROR_WARN_COUNT:-20}"
      SMOKE_PARSE_ERROR_FAIL_COUNT: "${SMOKE_PARSE_ERROR_FAIL_COUNT:-100}"
      SMOKE_INVALID_IMAGE_URL_WARN_COUNT: "${SMOKE_INVALID_IMAGE_URL_WARN_COUNT:-2000}"
      SMOKE_MIN_ACTIVE_PRODUCTS: "${SMOKE_MIN_ACTIVE_PRODUCTS:-1}"
      SMOKE_MISSING_IMAGE_WARN_COUNT: "${SMOKE_MISSING_IMAGE_WARN_COUNT:-200}"
      SMOKE_MISSING_IMAGE_FAIL_COUNT: "${SMOKE_MISSING_IMAGE_FAIL_COUNT:-500}"
      SMOKE_SOURCE_BROKEN_LINK_WARN_COUNT: "${SMOKE_SOURCE_BROKEN_LINK_WARN_COUNT:-1}"
      SMOKE_SOURCE_BROKEN_LINK_FAIL_COUNT: "${SMOKE_SOURCE_BROKEN_LINK_FAIL_COUNT:-50}"
      SMOKE_SOURCE_TEMPORARY_LINK_WARN_COUNT: "${SMOKE_SOURCE_TEMPORARY_LINK_WARN_COUNT:-100}"
      SMOKE_SOURCE_TEMPORARY_LINK_FAIL_COUNT: "${SMOKE_SOURCE_TEMPORARY_LINK_FAIL_COUNT:-500}"
      SMOKE_RAW_SNAPSHOT_NORMAL_RETENTION_DAYS: "${SMOKE_RAW_SNAPSHOT_NORMAL_RETENTION_DAYS:-30}"
      SMOKE_RAW_SNAPSHOT_ABNORMAL_RETENTION_DAYS: "${SMOKE_RAW_SNAPSHOT_ABNORMAL_RETENTION_DAYS:-90}"
      SMOKE_RAW_SNAPSHOT_RETENTION_GRACE_DAYS: "${SMOKE_RAW_SNAPSHOT_RETENTION_GRACE_DAYS:-2}"
      SMOKE_RAW_SNAPSHOT_WARN_COUNT: "${SMOKE_RAW_SNAPSHOT_WARN_COUNT:-1}"
      SMOKE_RAW_SNAPSHOT_FAIL_COUNT: "${SMOKE_RAW_SNAPSHOT_FAIL_COUNT:-100}"
    ports:
      - "${OPS_WEB_BIND_HOST:-127.0.0.1}:${OPS_WEB_PORT:-3001}:3000"
    volumes:
      - product_images:/var/lib/partsradar/product-images:ro
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const t=process.env.OPS_STATUS_TOKEN||''; if(!t||t.startsWith('replace_with_')) process.exit(1); fetch('http://127.0.0.1:3000/ops/status',{headers:{'x-ops-status-token':t}}).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  crawler:
    profiles:
      - manual-crawler
    build:
      context: .
      target: crawler
    restart: "no"
    environment:
      <<: *app-env
    volumes:
      - snapshots:/var/lib/partsradar/snapshots
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command:
      [
        "pnpm",
        "--filter",
        "@partsradar/crawler",
        "manual:crawl-coolpc-once",
        "--",
        "--storage-dir",
        "/var/lib/partsradar/snapshots",
        "--help",
      ]

  crawler-daemon:
    profiles:
      - scheduled-crawler
    build:
      context: .
      target: crawler
    restart: unless-stopped
    environment:
      <<: *app-env
      CRAWLER_INTERVAL_SECONDS: "${CRAWLER_INTERVAL_SECONDS:-1800}"
      CRAWLER_BACKOFF_SECONDS: "${CRAWLER_BACKOFF_SECONDS:-3600}"
      CRAWLER_LOCK_RETRY_SECONDS: "${CRAWLER_LOCK_RETRY_SECONDS:-120}"
      CRAWLER_CATEGORY_DELAY_MS: "${CRAWLER_CATEGORY_DELAY_MS:-8000}"
      PRODUCT_IMAGE_STORAGE_DIR: /var/lib/partsradar/product-images
      CRAWLER_NEW_PRODUCT_IMAGE_MIN_DELAY_MS: "${CRAWLER_NEW_PRODUCT_IMAGE_MIN_DELAY_MS:-5000}"
      CRAWLER_NEW_PRODUCT_IMAGE_MAX_DELAY_MS: "${CRAWLER_NEW_PRODUCT_IMAGE_MAX_DELAY_MS:-12000}"
      CRAWLER_NEW_PRODUCT_IMAGE_TIMEOUT_MS: "${CRAWLER_NEW_PRODUCT_IMAGE_TIMEOUT_MS:-15000}"
      CRAWLER_NEW_PRODUCT_IMAGE_MAX_SOURCE_BYTES: "${CRAWLER_NEW_PRODUCT_IMAGE_MAX_SOURCE_BYTES:-5242880}"
      EXTERNAL_FETCH_LOCK_STALE_SECONDS: "${EXTERNAL_FETCH_LOCK_STALE_SECONDS:-43200}"
      EXTERNAL_FETCH_PRIORITY_TTL_SECONDS: "${EXTERNAL_FETCH_PRIORITY_TTL_SECONDS:-600}"
      DISCORD_PUBLIC_WEBHOOK_URL: "${DISCORD_PUBLIC_WEBHOOK_URL:-replace_with_discord_public_webhook_url}"
      PRICE_CHANGE_DISCORD_MAX_ITEMS: "${PRICE_CHANGE_DISCORD_MAX_ITEMS:-50}"
    volumes:
      - snapshots:/var/lib/partsradar/snapshots
      - product_images:/var/lib/partsradar/product-images
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command:
      [
        "pnpm",
        "--filter",
        "@partsradar/crawler",
        "ops:crawl-coolpc-daemon",
        "--",
        "--confirm-live-fetch",
        "--storage-dir",
        "/var/lib/partsradar/snapshots",
      ]

  maintenance-daemon:
    profiles:
      - scheduled-crawler
    build:
      context: .
      target: crawler
    restart: unless-stopped
    environment:
      <<: *app-env
      MAINTENANCE_INTERVAL_SECONDS: "${MAINTENANCE_INTERVAL_SECONDS:-86400}"
      MAINTENANCE_INITIAL_DELAY_SECONDS: "${MAINTENANCE_INITIAL_DELAY_SECONDS:-900}"
      MAINTENANCE_PRICE_PRIORITY_PAUSE_SECONDS: "${MAINTENANCE_PRICE_PRIORITY_PAUSE_SECONDS:-300}"
      MAINTENANCE_LINK_LIMIT: "${MAINTENANCE_LINK_LIMIT:-200}"
      MAINTENANCE_LINK_STALE_AFTER_HOURS: "${MAINTENANCE_LINK_STALE_AFTER_HOURS:-48}"
      MAINTENANCE_LINK_MIN_DELAY_MS: "${MAINTENANCE_LINK_MIN_DELAY_MS:-10000}"
      MAINTENANCE_LINK_MAX_DELAY_MS: "${MAINTENANCE_LINK_MAX_DELAY_MS:-20000}"
      EXTERNAL_FETCH_LOCK_STALE_SECONDS: "${EXTERNAL_FETCH_LOCK_STALE_SECONDS:-43200}"
      EXTERNAL_FETCH_PRIORITY_TTL_SECONDS: "${EXTERNAL_FETCH_PRIORITY_TTL_SECONDS:-600}"
    volumes:
      - snapshots:/var/lib/partsradar/snapshots
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command:
      [
        "pnpm",
        "--filter",
        "@partsradar/crawler",
        "ops:maintenance-daemon",
        "--",
        "--confirm-live-fetch",
      ]

  raw-snapshot-cleanup-daemon:
    profiles:
      - scheduled-crawler
    build:
      context: .
      target: crawler
    restart: unless-stopped
    environment:
      <<: *app-env
      RAW_SNAPSHOT_CLEANUP_INTERVAL_SECONDS: "${RAW_SNAPSHOT_CLEANUP_INTERVAL_SECONDS:-86400}"
    volumes:
      - snapshots:/var/lib/partsradar/snapshots
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command:
      [
        "pnpm",
        "--filter",
        "@partsradar/crawler",
        "ops:raw-snapshots:cleanup-daemon",
        "--",
        "--confirm-delete",
        "--storage-dir",
        "/var/lib/partsradar/snapshots",
      ]

  smoke-daemon:
    profiles:
      - scheduled-crawler
    build:
      context: .
      target: crawler
    restart: unless-stopped
    environment:
      <<: *app-env
      SMOKE_PUBLIC_BASE_URL: "${SMOKE_PUBLIC_BASE_URL:-http://web:3000}"
      SMOKE_INTERVAL_SECONDS: "${SMOKE_INTERVAL_SECONDS:-300}"
      SMOKE_INITIAL_DELAY_SECONDS: "${SMOKE_INITIAL_DELAY_SECONDS:-60}"
      SMOKE_TIMEOUT_MS: "${SMOKE_TIMEOUT_MS:-5000}"
      SMOKE_PRODUCT_IMAGE_SAMPLE_SIZE: "${SMOKE_PRODUCT_IMAGE_SAMPLE_SIZE:-5}"
      SMOKE_SOURCE_WARN_AFTER_MINUTES: "${SMOKE_SOURCE_WARN_AFTER_MINUTES:-60}"
      SMOKE_SOURCE_FAIL_AFTER_MINUTES: "${SMOKE_SOURCE_FAIL_AFTER_MINUTES:-120}"
      SMOKE_CRAWLER_WARN_AFTER_MINUTES: "${SMOKE_CRAWLER_WARN_AFTER_MINUTES:-90}"
      SMOKE_CRAWLER_FAIL_AFTER_MINUTES: "${SMOKE_CRAWLER_FAIL_AFTER_MINUTES:-180}"
      SMOKE_RECENT_WINDOW_HOURS: "${SMOKE_RECENT_WINDOW_HOURS:-24}"
      SMOKE_PARSE_ERROR_WARN_COUNT: "${SMOKE_PARSE_ERROR_WARN_COUNT:-20}"
      SMOKE_PARSE_ERROR_FAIL_COUNT: "${SMOKE_PARSE_ERROR_FAIL_COUNT:-100}"
      SMOKE_INVALID_IMAGE_URL_WARN_COUNT: "${SMOKE_INVALID_IMAGE_URL_WARN_COUNT:-2000}"
      SMOKE_MIN_ACTIVE_PRODUCTS: "${SMOKE_MIN_ACTIVE_PRODUCTS:-1}"
      SMOKE_MISSING_IMAGE_WARN_COUNT: "${SMOKE_MISSING_IMAGE_WARN_COUNT:-200}"
      SMOKE_MISSING_IMAGE_FAIL_COUNT: "${SMOKE_MISSING_IMAGE_FAIL_COUNT:-500}"
      SMOKE_SOURCE_BROKEN_LINK_WARN_COUNT: "${SMOKE_SOURCE_BROKEN_LINK_WARN_COUNT:-1}"
      SMOKE_SOURCE_BROKEN_LINK_FAIL_COUNT: "${SMOKE_SOURCE_BROKEN_LINK_FAIL_COUNT:-50}"
      SMOKE_SOURCE_TEMPORARY_LINK_WARN_COUNT: "${SMOKE_SOURCE_TEMPORARY_LINK_WARN_COUNT:-100}"
      SMOKE_SOURCE_TEMPORARY_LINK_FAIL_COUNT: "${SMOKE_SOURCE_TEMPORARY_LINK_FAIL_COUNT:-500}"
      SMOKE_RAW_SNAPSHOT_NORMAL_RETENTION_DAYS: "${SMOKE_RAW_SNAPSHOT_NORMAL_RETENTION_DAYS:-30}"
      SMOKE_RAW_SNAPSHOT_ABNORMAL_RETENTION_DAYS: "${SMOKE_RAW_SNAPSHOT_ABNORMAL_RETENTION_DAYS:-90}"
      SMOKE_RAW_SNAPSHOT_RETENTION_GRACE_DAYS: "${SMOKE_RAW_SNAPSHOT_RETENTION_GRACE_DAYS:-2}"
      SMOKE_RAW_SNAPSHOT_WARN_COUNT: "${SMOKE_RAW_SNAPSHOT_WARN_COUNT:-1}"
      SMOKE_RAW_SNAPSHOT_FAIL_COUNT: "${SMOKE_RAW_SNAPSHOT_FAIL_COUNT:-100}"
      DISCORD_ADMIN_WEBHOOK_URL: "${DISCORD_ADMIN_WEBHOOK_URL:-replace_with_discord_admin_webhook_url}"
      SMOKE_DISCORD_STATE_FILE: "${SMOKE_DISCORD_STATE_FILE:-/var/lib/partsradar/snapshots/ops/smoke-discord-state.json}"
      SMOKE_DISCORD_COOLDOWN_SECONDS: "${SMOKE_DISCORD_COOLDOWN_SECONDS:-3600}"
    volumes:
      - snapshots:/var/lib/partsradar/snapshots
      - product_images:/var/lib/partsradar/product-images:ro
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    command:
      [
        "pnpm",
        "--filter",
        "@partsradar/crawler",
        "ops:production-smoke-daemon",
      ]

  discord-bot:
    profiles:
      - discord-bot
    build:
      context: .
      target: crawler
    restart: unless-stopped
    environment:
      <<: *app-env
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-replace_with_discord_bot_token}"
      DISCORD_APPLICATION_ID: "${DISCORD_APPLICATION_ID:-replace_with_discord_application_id}"
      DISCORD_BOT_REGISTER_COMMANDS_ON_START: "${DISCORD_BOT_REGISTER_COMMANDS_ON_START:-true}"
      DISCORD_PRICE_REPORT_MAX_ITEMS: "${DISCORD_PRICE_REPORT_MAX_ITEMS:-50}"
      DISCORD_BOT_COMMAND_COOLDOWN_SECONDS: "${DISCORD_BOT_COMMAND_COOLDOWN_SECONDS:-60}"
      DISCORD_PRICE_REPORT_SCHEDULE_INTERVAL_SECONDS: "${DISCORD_PRICE_REPORT_SCHEDULE_INTERVAL_SECONDS:-300}"
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command:
      [
        "pnpm",
        "--filter",
        "@partsradar/crawler",
        "ops:discord-bot",
      ]

  cloudflared:
    profiles:
      - public-tunnel
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:replace_with_pinned_version}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "run",
        "--token",
        "${CLOUDFLARE_TUNNEL_TOKEN:-replace_with_cloudflare_tunnel_token}",
      ]

volumes:
  postgres_data:
  snapshots:
  product_images:
