x-database-env: &database-env
  NODE_ENV: "production"
  DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public"

x-snapshot-storage-env: &snapshot-storage-env
  SNAPSHOT_STORAGE_DIR: "/var/lib/partsradar/snapshots"

x-product-image-storage-env: &product-image-storage-env
  PRODUCT_IMAGE_STORAGE_DIR: "/var/lib/partsradar/product-images"

x-external-fetch-lock-env: &external-fetch-lock-env
  EXTERNAL_FETCH_LOCK_DIR: "/var/lib/partsradar/snapshots/.locks/external-fetch"
  EXTERNAL_FETCH_LOCK_STALE_SECONDS: "${EXTERNAL_FETCH_LOCK_STALE_SECONDS:-43200}"

services:
  crawler:
    image: "${PARTSRADAR_CRAWLER_IMAGE:-partsradar-tw-crawler:local}"
    profiles:
      - manual-crawler
    build:
      context: .
      target: crawler
    restart: "no"
    environment:
      <<: [*database-env, *snapshot-storage-env, *external-fetch-lock-env]
    volumes:
      - snapshots:/var/lib/partsradar/snapshots
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command:
      [
        "pnpm",
        "--filter",
        "@partsradar/crawler",
        "manual:crawl-coolpc-once",
        "--",
        "--storage-dir",
        "/var/lib/partsradar/snapshots",
        "--help",
      ]

  image-cache-backfill:
    image: "${PARTSRADAR_CRAWLER_IMAGE:-partsradar-tw-crawler:local}"
    profiles:
      - manual-crawler
    build:
      context: .
      target: crawler
    restart: "no"
    environment:
      <<: [*database-env, *product-image-storage-env, *external-fetch-lock-env]
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - snapshots:/var/lib/partsradar/snapshots
      - product_images:/var/lib/partsradar/product-images
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command: ["pnpm", "ops:image-cache:backfill", "--", "--help"]

  crawler-daemon:
    image: "${PARTSRADAR_CRAWLER_IMAGE:-partsradar-tw-crawler:local}"
    profiles:
      - scheduled-crawler
    build:
      context: .
      target: crawler
    restart: unless-stopped
    environment:
      <<: [*database-env, *snapshot-storage-env, *product-image-storage-env, *external-fetch-lock-env]
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      CRAWLER_INTERVAL_SECONDS: "${CRAWLER_INTERVAL_SECONDS:-1800}"
      CRAWLER_BACKOFF_SECONDS: "${CRAWLER_BACKOFF_SECONDS:-3600}"
      CRAWLER_LOCK_RETRY_SECONDS: "${CRAWLER_LOCK_RETRY_SECONDS:-120}"
      CRAWLER_CATEGORY_DELAY_MS: "${CRAWLER_CATEGORY_DELAY_MS:-8000}"
      CRAWLER_NEW_PRODUCT_IMAGE_MIN_DELAY_MS: "${CRAWLER_NEW_PRODUCT_IMAGE_MIN_DELAY_MS:-5000}"
      CRAWLER_NEW_PRODUCT_IMAGE_MAX_DELAY_MS: "${CRAWLER_NEW_PRODUCT_IMAGE_MAX_DELAY_MS:-12000}"
      CRAWLER_NEW_PRODUCT_IMAGE_TIMEOUT_MS: "${CRAWLER_NEW_PRODUCT_IMAGE_TIMEOUT_MS:-15000}"
      CRAWLER_NEW_PRODUCT_IMAGE_MAX_SOURCE_BYTES: "${CRAWLER_NEW_PRODUCT_IMAGE_MAX_SOURCE_BYTES:-5242880}"
    volumes:
      - snapshots:/var/lib/partsradar/snapshots
      - product_images:/var/lib/partsradar/product-images
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command:
      [
        "pnpm",
        "--filter",
        "@partsradar/crawler",
        "ops:crawl-coolpc-daemon",
        "--",
        "--confirm-live-fetch",
        "--storage-dir",
        "/var/lib/partsradar/snapshots",
      ]

  raw-snapshot-cleanup-daemon:
    image: "${PARTSRADAR_CRAWLER_IMAGE:-partsradar-tw-crawler:local}"
    profiles:
      - scheduled-crawler
    build:
      context: .
      target: crawler
    restart: unless-stopped
    environment:
      <<: [*database-env, *snapshot-storage-env]
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      RAW_SNAPSHOT_CLEANUP_INTERVAL_SECONDS: "${RAW_SNAPSHOT_CLEANUP_INTERVAL_SECONDS:-86400}"
    volumes:
      - snapshots:/var/lib/partsradar/snapshots
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command:
      [
        "pnpm",
        "--filter",
        "@partsradar/crawler",
        "ops:raw-snapshots:cleanup-daemon",
        "--",
        "--confirm-delete",
        "--storage-dir",
        "/var/lib/partsradar/snapshots",
      ]
