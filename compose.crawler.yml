x-runtime-database-env: &runtime-database-env
  NODE_ENV: "production"
  DATABASE_URL: "postgresql://${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public"

x-snapshot-storage-env: &snapshot-storage-env
  SNAPSHOT_STORAGE_DIR: "/var/lib/partsradar/snapshots"

x-product-image-storage-env: &product-image-storage-env
  PRODUCT_IMAGE_STORAGE_DIR: "/var/lib/partsradar/product-images"

x-external-fetch-lock-env: &external-fetch-lock-env
  EXTERNAL_FETCH_LOCK_DIR: "/var/lib/partsradar/snapshots/.locks/external-fetch"
  EXTERNAL_FETCH_LOCK_STALE_SECONDS: "${EXTERNAL_FETCH_LOCK_STALE_SECONDS:-300}"

x-source-image-fetch-lock-env: &source-image-fetch-lock-env
  SOURCE_IMAGE_FETCH_LOCK_DIR: "/var/lib/partsradar/snapshots/.locks/source-image-fetch"
  SOURCE_IMAGE_FETCH_LOCK_STALE_SECONDS: "${SOURCE_IMAGE_FETCH_LOCK_STALE_SECONDS:-300}"

x-crawler-security: &crawler-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cpus: 1.0
  mem_limit: 1g
  pids_limit: 200
  networks:
    - backend

services:
  crawler:
    <<: *crawler-security
    image: "${PARTSRADAR_CRAWLER_IMAGE:-partsradar-tw-crawler:local}"
    profiles:
      - manual-crawler
    build:
      context: .
      target: crawler
    restart: "no"
    environment:
      <<: [*runtime-database-env, *snapshot-storage-env, *external-fetch-lock-env]
    volumes:
      - snapshots:/var/lib/partsradar/snapshots
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command:
      [
        "node",
        "--import",
        "tsx",
        "src/scripts/manual/crawl-coolpc-once.ts",
        "--storage-dir",
        "/var/lib/partsradar/snapshots",
        "--help",
      ]

  image-cache-backfill:
    <<: *crawler-security
    image: "${PARTSRADAR_CRAWLER_IMAGE:-partsradar-tw-crawler:local}"
    profiles:
      - manual-crawler
    build:
      context: .
      target: crawler
    restart: "no"
    environment:
      <<: [*runtime-database-env, *product-image-storage-env, *source-image-fetch-lock-env]
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - snapshots:/var/lib/partsradar/snapshots
      - product_images:/var/lib/partsradar/product-images
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command: ["node", "--import", "tsx", "src/scripts/ops/backfill-product-images.ts", "--help"]

  crawler-daemon:
    <<: *crawler-security
    image: "${PARTSRADAR_CRAWLER_IMAGE:-partsradar-tw-crawler:local}"
    profiles:
      - scheduled-crawler
    build:
      context: .
      target: crawler
    restart: unless-stopped
    stop_grace_period: 15m
    environment:
      <<: [*runtime-database-env, *snapshot-storage-env, *external-fetch-lock-env]
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      CRAWLER_INTERVAL_SECONDS: "${CRAWLER_INTERVAL_SECONDS:-1800}"
      CRAWLER_BACKOFF_SECONDS: "${CRAWLER_BACKOFF_SECONDS:-3600}"
      CRAWLER_LOCK_RETRY_SECONDS: "${CRAWLER_LOCK_RETRY_SECONDS:-120}"
      CRAWLER_LOCK_BUSY_RETRY_SECONDS: "${CRAWLER_LOCK_BUSY_RETRY_SECONDS:-45}"
      CRAWLER_LOCK_BUSY_MAX_RETRIES: "${CRAWLER_LOCK_BUSY_MAX_RETRIES:-5}"
      CRAWLER_FILTER_SYNC_INTERVAL_SECONDS: "${CRAWLER_FILTER_SYNC_INTERVAL_SECONDS:-604800}"
      CRAWLER_CATEGORY_DELAY_MS: "${CRAWLER_CATEGORY_DELAY_MS:-8000}"
    volumes:
      - snapshots:/var/lib/partsradar/snapshots
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command:
      [
        "node",
        "--import",
        "tsx",
        "src/scripts/ops/crawl-coolpc-daemon.ts",
        "--confirm-live-fetch",
        "--storage-dir",
        "/var/lib/partsradar/snapshots",
      ]

  image-cache-recovery-daemon:
    <<: *crawler-security
    image: "${PARTSRADAR_CRAWLER_IMAGE:-partsradar-tw-crawler:local}"
    profiles:
      - scheduled-crawler
    build:
      context: .
      target: crawler
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      <<: [*runtime-database-env, *snapshot-storage-env, *product-image-storage-env, *source-image-fetch-lock-env]
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      IMAGE_RECOVERY_INTERVAL_SECONDS: "${IMAGE_RECOVERY_INTERVAL_SECONDS:-300}"
      IMAGE_RECOVERY_BATCH_LIMIT: "${IMAGE_RECOVERY_BATCH_LIMIT:-25}"
      CRAWLER_NEW_PRODUCT_IMAGE_MIN_DELAY_MS: "${CRAWLER_NEW_PRODUCT_IMAGE_MIN_DELAY_MS:-5000}"
      CRAWLER_NEW_PRODUCT_IMAGE_MAX_DELAY_MS: "${CRAWLER_NEW_PRODUCT_IMAGE_MAX_DELAY_MS:-12000}"
      CRAWLER_NEW_PRODUCT_IMAGE_TIMEOUT_MS: "${CRAWLER_NEW_PRODUCT_IMAGE_TIMEOUT_MS:-15000}"
      CRAWLER_NEW_PRODUCT_IMAGE_MAX_SOURCE_BYTES: "${CRAWLER_NEW_PRODUCT_IMAGE_MAX_SOURCE_BYTES:-5242880}"
    volumes:
      - snapshots:/var/lib/partsradar/snapshots
      - product_images:/var/lib/partsradar/product-images
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command:
      [
        "node",
        "--import",
        "tsx",
        "src/scripts/ops/image-cache-recovery-daemon.ts",
        "--confirm-live-fetch",
        "--storage-dir",
        "/var/lib/partsradar/product-images",
      ]

  raw-snapshot-cleanup-daemon:
    <<: *crawler-security
    image: "${PARTSRADAR_CRAWLER_IMAGE:-partsradar-tw-crawler:local}"
    profiles:
      - scheduled-crawler
    build:
      context: .
      target: crawler
    restart: unless-stopped
    stop_grace_period: 15m
    environment:
      <<: [*runtime-database-env, *snapshot-storage-env]
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      RAW_SNAPSHOT_CLEANUP_INTERVAL_SECONDS: "${RAW_SNAPSHOT_CLEANUP_INTERVAL_SECONDS:-86400}"
      RAW_SNAPSHOT_CLEANUP_INITIAL_DELAY_SECONDS: "${RAW_SNAPSHOT_CLEANUP_INITIAL_DELAY_SECONDS:-300}"
      RAW_SNAPSHOT_CLEANUP_LOCK_BUSY_RETRY_SECONDS: "${RAW_SNAPSHOT_CLEANUP_LOCK_BUSY_RETRY_SECONDS:-60}"
      RAW_SNAPSHOT_CLEANUP_LOCK_BUSY_MAX_RETRIES: "${RAW_SNAPSHOT_CLEANUP_LOCK_BUSY_MAX_RETRIES:-5}"
    volumes:
      - snapshots:/var/lib/partsradar/snapshots
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command:
      [
        "node",
        "--import",
        "tsx",
        "src/scripts/ops/cleanup-raw-snapshots-daemon.ts",
        "--confirm-delete",
        "--storage-dir",
        "/var/lib/partsradar/snapshots",
      ]
