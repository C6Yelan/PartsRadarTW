name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: partsradar
          POSTGRES_PASSWORD: partsradar
          POSTGRES_USER: partsradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partsradar -d partsradar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      DATABASE_URL: postgresql://partsradar:partsradar@127.0.0.1:5432/partsradar?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_SKIP_BUILD: "1"
      PARTSRADAR_PUBLIC_BASE_URL: http://127.0.0.1:3100
      PRODUCT_IMAGE_STORAGE_DIR: ${{ github.workspace }}/storage/product-images
      SNAPSHOT_STORAGE_DIR: ${{ github.workspace }}/storage/snapshots
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare local storage
        run: mkdir -p storage/product-images storage/snapshots

      - name: Prepare database
        run: |
          pnpm db:generate
          pnpm db:deploy
          pnpm db:seed

      - name: Run unit checks
        run: |
          pnpm check
          pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright smoke
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
