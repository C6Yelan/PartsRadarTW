name: partsradar-tw

x-runtime-database-env: &runtime-database-env
  NODE_ENV: "production"
  DATABASE_URL: "postgresql://${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public"

x-migration-database-env: &migration-database-env
  NODE_ENV: "production"
  MIGRATION_DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public"
  POSTGRES_RUNTIME_USER: "${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}"
  POSTGRES_RUNTIME_PASSWORD: "${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}"

x-app-security: &app-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      PGDATA: "/var/lib/postgresql/data"
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 200
    networks:
      - backend

  migrate:
    <<: *app-security
    image: "${PARTSRADAR_MIGRATE_IMAGE:-partsradar-tw-migrate:local}"
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      <<: *migration-database-env
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 200
    networks:
      - backend

  seed:
    <<: *app-security
    image: "${PARTSRADAR_MIGRATE_IMAGE:-partsradar-tw-migrate:local}"
    build:
      context: .
      target: migrate
    restart: "no"
    command: ["node", "--import", "tsx", "prisma/seed.ts"]
    environment:
      <<: *runtime-database-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 100
    networks:
      - backend

  storage-init:
    image: "${PARTSRADAR_CRAWLER_IMAGE:-partsradar-tw-crawler:local}"
    build:
      context: .
      target: crawler
    user: root
    restart: "no"
    command:
      [
        "sh",
        "-c",
        "mkdir -p /var/lib/partsradar/snapshots /var/lib/partsradar/product-images && chown -R node:node /var/lib/partsradar/snapshots /var/lib/partsradar/product-images",
      ]
    volumes:
      - snapshots:/var/lib/partsradar/snapshots
      - product_images:/var/lib/partsradar/product-images
    security_opt:
      - no-new-privileges:true
    read_only: true
    network_mode: none
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 50

  web:
    <<: *app-security
    image: "${PARTSRADAR_WEB_IMAGE:-partsradar-tw-web:local}"
    build:
      context: .
      target: web
      args:
        CSP_MODE: "${CSP_MODE:-enforce}"
        CSP_REPORT_URI: "${CSP_REPORT_URI:-}"
    restart: unless-stopped
    environment:
      <<: *runtime-database-env
      PORT: 3000
      HOSTNAME: 0.0.0.0
      PRODUCT_IMAGE_STORAGE_DIR: "/var/lib/partsradar/product-images"
      PARTSRADAR_PUBLIC_BASE_URL: "${PARTSRADAR_PUBLIC_BASE_URL:-https://partsradar.net}"
      API_READ_RATE_LIMIT_MAX: "${API_READ_RATE_LIMIT_MAX:-120}"
      API_LIST_RATE_LIMIT_MAX: "${API_LIST_RATE_LIMIT_MAX:-360}"
      API_PRODUCT_MOVEMENT_RATE_LIMIT_MAX: "${API_PRODUCT_MOVEMENT_RATE_LIMIT_MAX:-30}"
      API_IMAGE_RATE_LIMIT_MAX: "${API_IMAGE_RATE_LIMIT_MAX:-1200}"
      SHARE_IMAGE_RATE_LIMIT_MAX: "${SHARE_IMAGE_RATE_LIMIT_MAX:-60}"
      API_RATE_LIMIT_WINDOW_SECONDS: "${API_RATE_LIMIT_WINDOW_SECONDS:-60}"
      API_RATE_LIMIT_CACHE_SIZE: "${API_RATE_LIMIT_CACHE_SIZE:-5000}"
      DISCORD_BOT_INVITE_URL: "${DISCORD_BOT_INVITE_URL:-}"
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    volumes:
      - product_images:/var/lib/partsradar/product-images:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=256m
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/source-status').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 200
    networks:
      - frontend
      - backend

volumes:
  postgres_data:
  snapshots:
  product_images:

networks:
  frontend:
  backend:
