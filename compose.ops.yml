x-database-env: &database-env
  NODE_ENV: "production"
  DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public"

services:
  smoke-daemon:
    image: "${PARTSRADAR_CRAWLER_IMAGE:-partsradar-tw-crawler:local}"
    profiles:
      - ops
    build:
      context: .
      target: crawler
    restart: unless-stopped
    environment:
      <<: *database-env
      PRODUCT_IMAGE_STORAGE_DIR: "/var/lib/partsradar/product-images"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SMOKE_PUBLIC_BASE_URL: "${SMOKE_PUBLIC_BASE_URL:-http://web:3000}"
      SMOKE_INTERVAL_SECONDS: "${SMOKE_INTERVAL_SECONDS:-300}"
      SMOKE_INITIAL_DELAY_SECONDS: "${SMOKE_INITIAL_DELAY_SECONDS:-60}"
      SMOKE_CYCLE_TIMEOUT_MS: "${SMOKE_CYCLE_TIMEOUT_MS:-30000}"
      SMOKE_TIMEOUT_MS: "${SMOKE_TIMEOUT_MS:-5000}"
      SMOKE_PRODUCT_IMAGE_SAMPLE_SIZE: "${SMOKE_PRODUCT_IMAGE_SAMPLE_SIZE:-5}"
      SMOKE_SOURCE_WARN_AFTER_MINUTES: "${SMOKE_SOURCE_WARN_AFTER_MINUTES:-60}"
      SMOKE_SOURCE_FAIL_AFTER_MINUTES: "${SMOKE_SOURCE_FAIL_AFTER_MINUTES:-120}"
      SMOKE_CRAWLER_WARN_AFTER_MINUTES: "${SMOKE_CRAWLER_WARN_AFTER_MINUTES:-90}"
      SMOKE_CRAWLER_FAIL_AFTER_MINUTES: "${SMOKE_CRAWLER_FAIL_AFTER_MINUTES:-180}"
      SMOKE_RECENT_WINDOW_HOURS: "${SMOKE_RECENT_WINDOW_HOURS:-24}"
      SMOKE_PARSE_ERROR_WARN_COUNT: "${SMOKE_PARSE_ERROR_WARN_COUNT:-20}"
      SMOKE_PARSE_ERROR_FAIL_COUNT: "${SMOKE_PARSE_ERROR_FAIL_COUNT:-100}"
      SMOKE_SOURCE_IMAGE_FAILURE_MIN_CONSECUTIVE: "${SMOKE_SOURCE_IMAGE_FAILURE_MIN_CONSECUTIVE:-3}"
      SMOKE_SOURCE_IMAGE_FAILURE_WARN_COUNT: "${SMOKE_SOURCE_IMAGE_FAILURE_WARN_COUNT:-100}"
      SMOKE_SOURCE_IMAGE_FAILURE_FAIL_COUNT: "${SMOKE_SOURCE_IMAGE_FAILURE_FAIL_COUNT:-300}"
      SMOKE_MIN_ACTIVE_PRODUCTS: "${SMOKE_MIN_ACTIVE_PRODUCTS:-1}"
      SMOKE_FILTER_EMPTY_WARN_MIN_COUNT: "${SMOKE_FILTER_EMPTY_WARN_MIN_COUNT:-10}"
      SMOKE_FILTER_EMPTY_WARN_RATIO: "${SMOKE_FILTER_EMPTY_WARN_RATIO:-0.005}"
      SMOKE_MISSING_IMAGE_WARN_COUNT: "${SMOKE_MISSING_IMAGE_WARN_COUNT:-30}"
      SMOKE_MISSING_IMAGE_FAIL_COUNT: "${SMOKE_MISSING_IMAGE_FAIL_COUNT:-100}"
      SMOKE_RAW_SNAPSHOT_NORMAL_RETENTION_DAYS: "${SMOKE_RAW_SNAPSHOT_NORMAL_RETENTION_DAYS:-30}"
      SMOKE_RAW_SNAPSHOT_ABNORMAL_RETENTION_DAYS: "${SMOKE_RAW_SNAPSHOT_ABNORMAL_RETENTION_DAYS:-90}"
      SMOKE_RAW_SNAPSHOT_RETENTION_GRACE_DAYS: "${SMOKE_RAW_SNAPSHOT_RETENTION_GRACE_DAYS:-2}"
      SMOKE_RAW_SNAPSHOT_WARN_COUNT: "${SMOKE_RAW_SNAPSHOT_WARN_COUNT:-1}"
      SMOKE_RAW_SNAPSHOT_FAIL_COUNT: "${SMOKE_RAW_SNAPSHOT_FAIL_COUNT:-100}"
      SMOKE_FILTER_SYNC_STATE_FILE: "${SMOKE_FILTER_SYNC_STATE_FILE:-/var/lib/partsradar/snapshots/ops/coolpc-filter-sync-state.json}"
      SMOKE_CRAWLER_RUNTIME_STATUS_FILE: "${SMOKE_CRAWLER_RUNTIME_STATUS_FILE:-/var/lib/partsradar/snapshots/ops/crawler-runtime-status.json}"
      DISCORD_ADMIN_WEBHOOK_URL: "${DISCORD_ADMIN_WEBHOOK_URL:-replace_with_discord_admin_webhook_url}"
      SMOKE_DISCORD_STATE_FILE: "${SMOKE_DISCORD_STATE_FILE:-/var/lib/partsradar/snapshots/ops/smoke-discord-state.json}"
      SMOKE_DISCORD_COOLDOWN_SECONDS: "${SMOKE_DISCORD_COOLDOWN_SECONDS:-43200}"
      SMOKE_WARNING_PENDING_CYCLES: "${SMOKE_WARNING_PENDING_CYCLES:-2}"
      SMOKE_FILTER_QUALITY_PENDING_CYCLES: "${SMOKE_FILTER_QUALITY_PENDING_CYCLES:-3}"
      SMOKE_RECOVERY_GOOD_CYCLES: "${SMOKE_RECOVERY_GOOD_CYCLES:-2}"
      SMOKE_FAIL_REMINDER_SECONDS: "${SMOKE_FAIL_REMINDER_SECONDS:-3600}"
      SMOKE_PROGRESS_STALE_SECONDS: "${SMOKE_PROGRESS_STALE_SECONDS:-900}"
    volumes:
      - snapshots:/var/lib/partsradar/snapshots
      - product_images:/var/lib/partsradar/product-images:ro
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    command:
      [
        "pnpm",
        "--filter",
        "@partsradar/crawler",
        "ops:production-smoke-daemon",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "pnpm",
          "--filter",
          "@partsradar/crawler",
          "ops:production-smoke:health",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  discord-bot:
    image: "${PARTSRADAR_CRAWLER_IMAGE:-partsradar-tw-crawler:local}"
    profiles:
      - discord-bot
    build:
      context: .
      target: crawler
    restart: unless-stopped
    environment:
      <<: *database-env
      PARTSRADAR_PUBLIC_BASE_URL: "${PARTSRADAR_PUBLIC_BASE_URL:-https://partsradar.net}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-replace_with_discord_bot_token}"
      DISCORD_APPLICATION_ID: "${DISCORD_APPLICATION_ID:-replace_with_discord_application_id}"
      DISCORD_API_BASE_URL: "${DISCORD_API_BASE_URL:-https://discord.com/api/v10}"
      DISCORD_GATEWAY_URL: "${DISCORD_GATEWAY_URL:-wss://gateway.discord.gg/?v=10&encoding=json}"
      DISCORD_BOT_REGISTER_COMMANDS_ON_START: "${DISCORD_BOT_REGISTER_COMMANDS_ON_START:-true}"
      DISCORD_FEATURE_PUBLIC_REPORTS_ENABLED: "${DISCORD_FEATURE_PUBLIC_REPORTS_ENABLED:-true}"
      DISCORD_FEATURE_PERSONAL_REPORTS_ENABLED: "${DISCORD_FEATURE_PERSONAL_REPORTS_ENABLED:-true}"
      DISCORD_FEATURE_TARGET_WATCHES_ENABLED: "${DISCORD_FEATURE_TARGET_WATCHES_ENABLED:-true}"
      DISCORD_BOT_COMMAND_COOLDOWN_SECONDS: "${DISCORD_BOT_COMMAND_COOLDOWN_SECONDS:-60}"
      DISCORD_PRICE_REPORT_SCHEDULE_INTERVAL_SECONDS: "${DISCORD_PRICE_REPORT_SCHEDULE_INTERVAL_SECONDS:-300}"
      CRAWLER_RUNTIME_STATUS_FILE: "/var/lib/partsradar/snapshots/ops/crawler-runtime-status.json"
    volumes:
      - snapshots:/var/lib/partsradar/snapshots:ro
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command:
      [
        "pnpm",
        "--filter",
        "@partsradar/crawler",
        "ops:discord-bot",
      ]
